name: Setup
description: Install pnpm, Node and the project dependencies (with the pnpm store cached).

runs:
  using: composite
  steps:
    - uses: pnpm/setup@v2

    - uses: actions/setup-node@v7
      with:
        node-version: 24.x
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
