name: Build and Deploy Docs
on:
  workflow_call:
  push:
    branches:
      - main
    paths:
      - "docs/**"

# Let a deployment in progress finish rather than leave the site half published; the newest queued run deploys next.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      # Always build the tip of main: when called from the release workflow this includes the release commit, which
      # carries the version stamped into docs/conf.py.
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Build Documentation
        run: docker compose run --rm --user "$(id -u):$(id -g)" docs make html

      - name: Upload Documentation
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs/_build/html

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Documentation
        id: deployment
        uses: actions/deploy-pages@v5
