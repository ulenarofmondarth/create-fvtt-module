name: Release

# Runs only after the CI workflow has passed for a push to main.
on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Release
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      published: ${{ steps.result.outputs.published }}
    steps:
      # Release exactly the commit CI passed on. If main has moved on since, semantic-release sees the checkout is
      # behind and skips; the newer commit gets its own run.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - uses: ./.github/actions/setup

      # semantic-release numbers a first release 1.0.0. A v0.0.0 tag gives it a release to count from instead, so the
      # first `feat` publishes 0.1.0. Only ever runs while the repository has no version tag.
      #
      # GitHub refuses a push that puts a ref on a commit whose workflow files differ from the current ones unless the
      # token may edit workflows, which this one need not. So the tag goes on the oldest commit that has the workflow
      # files as they are now: the first commit, unless a workflow has changed since.
      - name: Start versioning at 0.x
        run: |
          if [ -z "$(git tag --list 'v*')" ]; then
            workflows="$(git rev-parse HEAD:.github/workflows)"
            start="$(git rev-parse HEAD)"
            for commit in $(git rev-list --first-parent HEAD); do
              [ "$(git rev-parse --quiet --verify "$commit:.github/workflows")" = "$workflows" ] || break
              start="$commit"
            done

            if [ -n "$(git rev-list --max-count=1 "$start^@")" ]; then
              echo "::warning::Versions are counted from ${start:0:7}, the last commit to change a workflow, not from the first commit: earlier commits do not count towards the first release. To count them, push a v0.0.0 tag to the first commit yourself."
            fi

            git tag v0.0.0 "$start"
            git push origin v0.0.0
          fi

      - name: Release
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          HUSKY: 0

      - name: Check whether a release was published
        id: result
        run: echo "published=$(git tag --points-at HEAD | grep -c '^v' || true)" >> "$GITHUB_OUTPUT"

  docs:
    name: Publish documentation
    needs: release
    if: ${{ needs.release.outputs.published != '0' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/build-and-deploy-docs.yml
