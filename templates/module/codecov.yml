# Codecov reports coverage on pull requests; the thresholds in the Vite configuration are what fail CI.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

flags:
  unit:
    paths:
      - src/
    carryforward: true

comment:
  layout: 'condensed_header, diff, flags, files'
