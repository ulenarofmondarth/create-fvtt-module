name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, format and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm run format:check
      - run: pnpm test
      - run: pnpm build

  smoke:
    name: Pack, generate a project (${{ matrix.project }}) and run its checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The documentation tooling is the same in all of them. Building it for these two covers every page, with
          # and without the parts that depend on the language and the UI framework.
          - project: TypeScript, Svelte
            options: --docs
          - project: TypeScript, no UI framework
            options: --no-ui-framework
          - project: JavaScript, Svelte
            options: --javascript
          - project: JavaScript, no UI framework
            options: --javascript --no-ui-framework --docs
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:smoke ${{ matrix.options }}
