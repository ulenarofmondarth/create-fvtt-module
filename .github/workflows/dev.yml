name: Dev CI

# The full quality gate. Runs on every push to `dev` and on every pull request. The release
# workflow calls it for pushes to `main`, so nothing is released without passing it.
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false
  workflow_dispatch:

concurrency:
  group: dev-ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  HUSKY: "0"

jobs:
  commits:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Lint the pull request's commit messages
        run: >-
          pnpm exec commitlint --verbose
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

  check:
    name: Typecheck, format and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm typecheck
      - run: pnpm run format:check
      - run: pnpm build

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Tests with the coverage gate
        run: pnpm test:coverage
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: node scripts/coverage-summary.ts coverage/coverage-summary.json 'Unit coverage' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/lcov.info
          flags: unit
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Keep the coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit
          path: coverage
          retention-days: 7

  smoke:
    name: Pack, generate a project (${{ matrix.project }}) and run its checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The documentation tooling is the same in all of them. Building it for these three covers every page, in
          # each form the language and the UI framework give it.
          - project: TypeScript, Svelte
            options: --docs
          - project: TypeScript, Lit
            options: --lit
          - project: TypeScript, no UI framework
            options: --no-ui-framework
          - project: JavaScript, Svelte
            options: --javascript
          - project: JavaScript, Lit
            options: --javascript --lit --docs
          - project: JavaScript, no UI framework
            options: --javascript --no-ui-framework --docs
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm run test:smoke ${{ matrix.options }}

  # A single required check for branch protection.
  ci-passed:
    name: CI passed
    if: ${{ always() }}
    needs: [commits, check, unit, smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Check that every job passed (or was skipped)
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")'
